
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Сериалы — @makson4ij</title>
<meta name="description" content="ИИ-сериалы, созданные нейросетями. Смотри в TikTok @makson4ij">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dark:   #0b0d12;
    --mid:    #1a1f2b;
    --light:  #e8ecf5;
    --white:  #f7f9fc;
    --accent: #4f8cff;
    --accent2:#a855f7;
    --text:   #e8eaf0;
    --muted:  #9aa3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg,
      var(--dark) 0%,
      var(--mid) 40%,
      #3a4560 70%,
      var(--light) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Навигация ---------- */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px;
    backdrop-filter: blur(14px);
    background: rgba(11,13,18,.55);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  nav .logo {
    font-weight: 800; font-size: 18px; letter-spacing: -.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  nav a {
    color: var(--text); text-decoration: none; font-size: 14px;
    margin-left: 20px; opacity: .8; transition: opacity .2s;
  }
  nav a:hover { opacity: 1; }

  /* ---------- Hero ---------- */
  header {
    text-align: center;
    padding: 90px 20px 70px;
    position: relative;
  }
  header::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 20%, rgba(79,140,255,.25), transparent 60%);
  }
  h1 {
    font-size: clamp(32px, 7vw, 64px);
    font-weight: 800; line-height: 1.05; letter-spacing: -2px;
    margin-bottom: 18px;
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    font-size: clamp(15px, 2.2vw, 19px);
    color: var(--muted); max-width: 560px; margin: 0 auto 32px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px; border-radius: 50px;
    font-weight: 600; font-size: 15px; text-decoration: none;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 8px 30px rgba(79,140,255,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(168,85,247,.45); }

  /* ---------- Секции ---------- */
  section { padding: 60px 20px; max-width: 1100px; margin: 0 auto; }
  h2 {
    font-size: clamp(24px, 4vw, 36px); font-weight: 800;
    letter-spacing: -1px; margin-bottom: 32px; text-align: center;
  }
